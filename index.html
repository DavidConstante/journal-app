<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/journal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Journal — tu diario personal privado. Un espacio cálido para escribir, reflexionar y guardar tus días."
    />
    <meta name="theme-color" content="#efe8da" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211e1a" media="(prefers-color-scheme: dark)" />
    <title>Journal — Tu diario personal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the persisted (or system) theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('journal-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>

  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
